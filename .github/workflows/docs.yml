name: docs

on:
  # Docs deploy only on package releases (the `v*` tag pushed by the release
  # workflow), not on every push to main.
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: corepack enable

      - name: Install dependencies
        run: pnpm i

      - name: Prepare workspace (module types)
        run: pnpm run docs:prepare

      - name: Generate docs
        run: pnpm run docs:generate
        env:
          NUXT_APP_BASE_URL: /nuxt-otel/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
