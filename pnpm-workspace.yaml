packages:
  - "playgrounds/*"
  - "docs"
overrides:
  # keep the nuxt 5 playground fully on nightly packages
  nuxt-otel-playground-nuxt5>nuxt: npm:nuxt-nightly@5x
  "nuxt-nightly>@nuxt/kit": npm:@nuxt/kit-nightly@5x
  "nuxt-nightly>@nuxt/nitro-server": npm:@nuxt/nitro-server-nightly@5x
  "nuxt-nightly>@nuxt/schema": npm:@nuxt/schema-nightly@5x
  "nuxt-nightly>@nuxt/vite-builder": npm:@nuxt/vite-builder-nightly@5x
allowBuilds:
  "@parcel/watcher": true
  better-sqlite3: true
  dprint: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
minimumReleaseAgeExclude:
  - "@nuxt/kit"
  - nuxt
  - nuxt-nightly
  - "@nuxt/*"
  - "@nuxt/schema"
  - "@nuxt/nitro-server@4.6.0 || 4.6.1"
  - "@nuxt/vite-builder@4.6.0 || 4.6.1"
  - "@nuxt/test-utils@4.3.3"
  - "@nuxt/devtools-ui-kit@3.4.3"
  - "@nuxt/devtools-wizard@3.4.3"
  - "@nuxt/devtools@3.4.3"
  - structured-clone-es@2.0.1
  - vite-opentelemetry-inspector@0.0.2 || 0.1.0
